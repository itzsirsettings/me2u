name: iOS

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      signed_archive:
        description: "Create a signed App Store archive using the protected app-store environment"
        required: true
        type: boolean
        default: false

jobs:
  simulator:
    name: iOS simulator build and tests
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run native unit tests and typecheck
        run: |
          npm test
          npm run typecheck
      - name: Install iOS pods
        run: |
          bundle install
          bundle exec pod install --project-directory=ios
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -workspace ios/Me2U.xcworkspace
          -scheme Me2U
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  signed-archive:
    name: Signed App Store archive
    if: github.event_name == 'workflow_dispatch' && inputs.signed_archive
    needs: simulator
    runs-on: macos-latest
    environment: app-store
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: |
          npm ci
          bundle install
          bundle exec pod install --project-directory=ios
      - name: Import distribution signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${IOS_CERTIFICATE_BASE64:?Missing distribution certificate secret}"
          : "${IOS_CERTIFICATE_PASSWORD:?Missing distribution certificate password secret}"
          : "${IOS_PROFILE_BASE64:?Missing provisioning profile secret}"
          : "${IOS_KEYCHAIN_PASSWORD:?Missing temporary keychain password secret}"
          KEYCHAIN_PATH="$RUNNER_TEMP/me2u-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/me2u-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/me2u-appstore.mobileprovision"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive for App Store
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${IOS_TEAM_ID:?Missing Apple Developer Team ID secret}"
          bundle exec pod install --project-directory=ios
          xcodebuild \
            -workspace ios/Me2U.xcworkspace \
            -scheme Me2U \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Me2U.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            archive
      - name: Upload signed archive
        uses: actions/upload-artifact@v4
        with:
          name: me2u-ios-appstore-archive
          path: ${{ runner.temp }}/Me2U.xcarchive
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing assets
        if: always()
        run: |
          set +e
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH"
          rm -f "${CERTIFICATE_PATH:-}" "${PROFILE_PATH:-}"
          [ -n "${PROFILE_UUID:-}" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
